[project]
name = "macro-studio-engines"
version = "0.1.0"
description = "Deterministic quantitative computation and portfolio operations substrate"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "polars>=1.0.0",
    "pyarrow>=17.0.0",
    "numpy>=2.0.0",
    "scipy>=1.14.0",
    "pandera[polars]>=0.20.0",
    "pydantic>=2.8.0",
    "typer>=0.12.0",
    "rich>=13.8.0",
    "jinja2>=3.1.0",
    "streamlit>=1.38.0",
    "xlsxwriter>=3.2.0",
    "openpyxl>=3.1.5",
    "blpapi>=3.24.0",
    "xbbg>=0.7.7",
    "QuantLib>=1.35",
    "open-source-risk-engine>=1.8.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-regressions>=2.5.0",
    "hypothesis>=6.110.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pre-commit>=3.8.0",
    "detect-secrets>=1.5.0",
]

[tool.uv]
python-preference = "only-system"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "ARG"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "blpapi.*",
    "xbbg.*",
    "QuantLib.*",
    "ORE.*",
    "open_source_risk_engine.*",
    "openpyxl.*",
    "xlsxwriter.*",
    "pytest_regressions.*"
]
ignore_missing_imports = true